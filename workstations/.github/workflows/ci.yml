name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs when a new commit is pushed (except on main/master)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  check:
    name: Check Nix Flake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Check flake
        run: nix flake check --show-trace

      - name: Verify flake metadata
        run: nix flake metadata

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Check formatting
        run: |
          echo "Running nix fmt..."
          nix fmt
          if ! git diff --exit-code; then
            echo "❌ Code is not formatted. Run 'make fmt' locally."
            echo ""
            echo "Files that need formatting:"
            git diff --name-only
            echo ""
            echo "Diff:"
            git diff
            exit 1
          fi
          echo "✅ All files are properly formatted"

  build-darwin:
    name: Build macOS Configuration
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Build darwin configuration
        run: |
          nix build .#darwinConfigurations.Mikael-MacBook-Pro-H7D6Q4TMVY.system \
            --show-trace \
            --fallback

  build-linux:
    name: Build Linux Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Build home-manager configuration
        run: |
          nix build .#homeConfigurations.\"mikaelsiidorow@pop-os\".activationPackage \
            --show-trace \
            --fallback

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [check, format, build-darwin, build-linux]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.check.result }}" != "success" ] || \
             [ "${{ needs.format.result }}" != "success" ] || \
             [ "${{ needs.build-darwin.result }}" != "success" ] || \
             [ "${{ needs.build-linux.result }}" != "success" ]; then
            echo "❌ CI failed. Check the logs above."
            exit 1
          fi
          echo "✅ All CI checks passed!"
