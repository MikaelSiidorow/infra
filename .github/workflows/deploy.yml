name: Deploy
on:
  workflow_dispatch:
    inputs:
      component:
        description: "Component to deploy"
        required: true
        type: choice
        options:
          - all
          - nixos
          - k8s-terraform
          - terraform
  pull_request:
    branches: [main]
    paths:
      - "nixos/**"
      - "flake.nix"
      - "flake.lock"
      - "terraform/**"
      - ".github/workflows/deploy.yml"
      - ".github/scripts/reconcile-wger.sh"
  push:
    branches: [main]
    paths:
      - "nixos/**"
      - "flake.nix"
      - "flake.lock"
      - "terraform/**"
      - ".github/workflows/deploy.yml"
      - ".github/scripts/reconcile-wger.sh"
permissions:
  contents: read
  pull-requests: write
env:
  K3S_HOST: ${{ vars.K3S_HOST }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      nixos: ${{ steps.filter.outputs.nixos }}
      terraform: ${{ steps.filter.outputs.terraform }}
      k8s_terraform: ${{ steps.filter.outputs.k8s_terraform }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            nixos:
              - 'nixos/**'
              - 'flake.nix'
              - 'flake.lock'
            terraform:
              - 'terraform/**'
              - '!terraform/k8s/**'
            k8s_terraform:
              - 'terraform/k8s/**'
              - 'terraform/mail.tf'
              - 'terraform/outputs.tf'
              - '.github/workflows/deploy.yml'
              - '.github/scripts/reconcile-wger.sh'
  nixos-preview:
    needs: changes
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.nixos == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/checkout@v6
        with:
          path: pr
      - uses: cachix/install-nix-action@v30
      - name: Build base config
        id: build-base
        run: nix build ./base#nixosConfigurations.k8s-server.config.system.build.toplevel -o result-base
        continue-on-error: true
      - name: Build PR config
        id: build-pr
        run: nix build ./pr#nixosConfigurations.k8s-server.config.system.build.toplevel -o result-pr
        continue-on-error: true
      - name: Check PR flake
        id: check-pr
        run: nix flake check ./pr
        continue-on-error: true
      - name: Build PR Hestia config
        id: build-hestia
        run: nix build ./pr#nixosConfigurations.hestia.config.system.build.toplevel -o result-hestia
        continue-on-error: true
      - name: Diff closures
        id: diff
        if: steps.build-base.outcome == 'success' && steps.build-pr.outcome == 'success'
        run: |
          output=$(nix store diff-closures ./result-base ./result-pr 2>&1) || true
          if [ -z "$output" ]; then
            output="No changes detected."
          fi
          {
            echo "diff<<EOF"
            echo "$output"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        continue-on-error: true
      - name: Comment PR
        uses: actions/github-script@v7
        env:
          DIFF_OUTPUT: ${{ steps.diff.outputs.diff }}
        with:
          script: |
            const buildBase = '${{ steps.build-base.outcome }}';
            const buildPr = '${{ steps.build-pr.outcome }}';
            const checkPr = '${{ steps.check-pr.outcome }}';
            const buildHestia = '${{ steps.build-hestia.outcome }}';
            const diff = '${{ steps.diff.outcome }}';
            const diffOutput = process.env.DIFF_OUTPUT || 'No diff output available.';

            const s = (v) => v === 'success' ? '✅' : '❌';

            const body = [
              '### NixOS Preview',
              '',
              '| Step | Status |',
              '|------|--------|',
              `| Build (base) | ${s(buildBase)} |`,
              `| Build (PR) | ${s(buildPr)} |`,
              `| Check flake (PR) | ${s(checkPr)} |`,
              `| Build Hestia (PR) | ${s(buildHestia)} |`,
              `| Diff | ${s(diff)} |`,
              '',
              '<details><summary>Show Changes</summary>',
              '',
              '```',
              diffOutput,
              '```',
              '',
              '</details>',
              '',
              `*Pushed by @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('### NixOS Preview'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
      - name: Fail on build error
        if: |
          steps.build-base.outcome == 'failure' ||
          steps.build-pr.outcome == 'failure' ||
          steps.check-pr.outcome == 'failure' ||
          steps.build-hestia.outcome == 'failure'
        run: exit 1
  terraform:
    needs: changes
    if: |
      (github.event_name == 'pull_request' && needs.changes.outputs.terraform == 'true') ||
      (github.event_name == 'push' && needs.changes.outputs.terraform == 'true') ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["terraform", "all"]'), github.event.inputs.component))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SCW_ACCESS_KEY: ${{ vars.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      TF_VAR_scaleway_organization_id: ${{ vars.SCW_ORGANIZATION_ID }}
      TF_VAR_scaleway_project_id: ${{ vars.SCW_PROJECT_ID }}
      TF_VAR_scaleway_billing_alert_email: ${{ vars.SCW_BILLING_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~1.12
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true
      - name: Terraform Init
        id: init
        run: terraform init
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true
      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fmt = '${{ steps.fmt.outcome }}';
            const init = '${{ steps.init.outcome }}';
            const validate = '${{ steps.validate.outcome }}';
            const plan = '${{ steps.plan.outcome }}';

            const output = [
              '### Terraform Results',
              '',
              '| Step | Status |',
              '|------|--------|',
              `| Format | ${fmt === 'success' ? '✅' : '❌'} |`,
              `| Init | ${init === 'success' ? '✅' : '❌'} |`,
              `| Validate | ${validate === 'success' ? '✅' : '❌'} |`,
              `| Plan | ${plan === 'success' ? '✅' : '❌'} |`,
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```terraform',
              `${{ steps.plan.outputs.stdout }}`,
              '```',
              '',
              '</details>',
              '',
              `*Pushed by @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('### Terraform Results'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: output
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output
              });
            }
      - name: Fail on format or plan error
        if: steps.fmt.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: exit 1
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: terraform apply -auto-approve tfplan
  nixos:
    needs: [changes, terraform]
    if: |
      always() &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') &&
      ((github.event_name == 'push' && needs.changes.outputs.nixos == 'true') ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["nixos", "all"]'), github.event.inputs.component)))
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.K3S_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.K3S_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy NixOS
        run: ssh root@${{ env.K3S_HOST }} "nixos-rebuild switch --flake 'github:MikaelSiidorow/infra/${{ github.sha }}#k8s-server'"
  k8s-terraform:
    needs: [changes, terraform, nixos]
    if: |
      always() &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') &&
      (needs.nixos.result == 'success' || needs.nixos.result == 'skipped') &&
      ((github.event_name == 'pull_request' && needs.changes.outputs.k8s_terraform == 'true') ||
      (github.event_name == 'push' && needs.changes.outputs.k8s_terraform == 'true') ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["k8s-terraform", "all"]'), github.event.inputs.component)))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/k8s
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~1.12
      - name: Setup SSH and K8s access
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.K3S_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.K3S_HOST }} >> ~/.ssh/known_hosts
          ssh -fN -L 6443:127.0.0.1:6443 root@${{ env.K3S_HOST }}
          ssh root@${{ env.K3S_HOST }} cat /etc/rancher/k3s/k3s.yaml > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
      - name: Ensure wger namespace exists
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          ssh root@${{ env.K3S_HOST }} \
            "k3s kubectl create namespace wger --dry-run=client -o yaml | k3s kubectl apply -f -"
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true
      - name: Terraform Init
        id: init
        run: terraform init
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true
        env:
          KUBE_CONFIG_PATH: /tmp/kubeconfig
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_refinery_postgres_password: ${{ secrets.REFINERY_POSTGRES_PASSWORD }}
          TF_VAR_refinery_encryption_key: ${{ secrets.REFINERY_ENCRYPTION_KEY }}
          TF_VAR_refinery_github_client_secret: ${{ secrets.REFINERY_GITHUB_CLIENT_SECRET }}
          TF_VAR_refinery_linkedin_client_secret: ${{ secrets.REFINERY_LINKEDIN_CLIENT_SECRET }}
          TF_VAR_refinery_zero_admin_password: ${{ secrets.REFINERY_ZERO_ADMIN_PASSWORD }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TF_VAR_brawl_stars_api_key: ${{ secrets.BRAWL_STARS_API_KEY }}
          TF_VAR_wger_postgres_password: ${{ secrets.WGER_POSTGRES_PASSWORD }}
          TF_VAR_wger_powersync_password: ${{ secrets.WGER_POWERSYNC_PASSWORD }}
          TF_VAR_wger_secret_key: ${{ secrets.WGER_SECRET_KEY }}
          TF_VAR_wger_jwt_public_key: ${{ secrets.WGER_JWT_PUBLIC_KEY }}
          TF_VAR_wger_jwt_private_key: ${{ secrets.WGER_JWT_PRIVATE_KEY }}
      - name: Detect Wger credential changes
        id: wger-changes
        if: steps.plan.outcome == 'success'
        run: |
          set -o pipefail
          changed="$(
            terraform show -json tfplan |
              jq -r '
                any(
                  .resource_changes[]?;
                  (
                    .address == "kubernetes_secret_v1.wger_secrets" or
                    (.address | startswith("kubernetes_secret_v1.wger_email"))
                  ) and .change.actions != ["no-op"]
                )
              '
          )"
          if [[ "$changed" != "true" && "$changed" != "false" ]]; then
            echo "Unexpected Wger change result: $changed" >&2
            exit 1
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fmt = '${{ steps.fmt.outcome }}';
            const init = '${{ steps.init.outcome }}';
            const validate = '${{ steps.validate.outcome }}';
            const plan = '${{ steps.plan.outcome }}';

            const output = [
              '### K8s Terraform Results',
              '',
              '| Step | Status |',
              '|------|--------|',
              `| Format | ${fmt === 'success' ? '✅' : '❌'} |`,
              `| Init | ${init === 'success' ? '✅' : '❌'} |`,
              `| Validate | ${validate === 'success' ? '✅' : '❌'} |`,
              `| Plan | ${plan === 'success' ? '✅' : '❌'} |`,
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```terraform',
              `${{ steps.plan.outputs.stdout }}`,
              '```',
              '',
              '</details>',
              '',
              `*Pushed by @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('### K8s Terraform Results'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: output
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output
              });
            }
      - name: Fail on format or plan error
        if: steps.fmt.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: exit 1
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          KUBE_CONFIG_PATH: /tmp/kubeconfig
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_refinery_postgres_password: ${{ secrets.REFINERY_POSTGRES_PASSWORD }}
          TF_VAR_refinery_encryption_key: ${{ secrets.REFINERY_ENCRYPTION_KEY }}
          TF_VAR_refinery_github_client_secret: ${{ secrets.REFINERY_GITHUB_CLIENT_SECRET }}
          TF_VAR_refinery_linkedin_client_secret: ${{ secrets.REFINERY_LINKEDIN_CLIENT_SECRET }}
          TF_VAR_refinery_zero_admin_password: ${{ secrets.REFINERY_ZERO_ADMIN_PASSWORD }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TF_VAR_brawl_stars_api_key: ${{ secrets.BRAWL_STARS_API_KEY }}
          TF_VAR_wger_postgres_password: ${{ secrets.WGER_POSTGRES_PASSWORD }}
          TF_VAR_wger_powersync_password: ${{ secrets.WGER_POWERSYNC_PASSWORD }}
          TF_VAR_wger_secret_key: ${{ secrets.WGER_SECRET_KEY }}
          TF_VAR_wger_jwt_public_key: ${{ secrets.WGER_JWT_PUBLIC_KEY }}
          TF_VAR_wger_jwt_private_key: ${{ secrets.WGER_JWT_PRIVATE_KEY }}
        run: terraform apply -auto-approve tfplan
      - name: Reconcile changed wger credentials
        if: |
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          steps.wger-changes.outputs.changed == 'true'
        env:
          WGER_POSTGRES_PASSWORD: ${{ secrets.WGER_POSTGRES_PASSWORD }}
        run: ../../.github/scripts/reconcile-wger.sh "${{ env.K3S_HOST }}"
