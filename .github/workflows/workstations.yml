name: Workstations

on:
  # Pull requests run this through ci.yml, which owns the required CI Summary.
  workflow_call:
  push:
    branches: ["main"]
    paths:
      - "workstations/**"
      - ".github/workflows/workstations.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: workstations

# Cancel in-progress runs when a new commit is pushed (except on main). The
# group is spelled out because github.workflow is the caller's name in a
# workflow_call.
concurrency:
  group: workstations-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check Nix Flake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Check flake
        run: nix flake check --show-trace

      - name: Verify flake metadata
        run: nix flake metadata

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Check formatting
        run: |
          echo "Running nix fmt..."
          nix fmt
          if ! git diff --exit-code; then
            echo "❌ Code is not formatted. Run 'make fmt' locally."
            echo ""
            echo "Files that need formatting:"
            git diff --name-only
            echo ""
            echo "Diff:"
            git diff
            exit 1
          fi
          echo "✅ All files are properly formatted"

  build-darwin:
    name: Build macOS Configuration
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Build darwin configuration
        run: |
          nix build .#darwinConfigurations.Mikael-MacBook-Pro-H7D6Q4TMVY.system \
            --show-trace \
            --fallback

  build-linux:
    name: Build Linux Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Build home-manager configuration
        run: |
          nix build .#homeConfigurations.\"mikaelsiidorow@tpad\".activationPackage \
            --show-trace \
            --fallback

  report:
    name: CI report section
    runs-on: ubuntu-latest
    needs: [check, format, build-darwin, build-linux]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write CI report section
        env:
          CHECK: ${{ needs.check.result }}
          FORMAT: ${{ needs.format.result }}
          DARWIN: ${{ needs.build-darwin.result }}
          LINUX: ${{ needs.build-linux.result }}
        run: |
          mark() { [ "$1" = success ] && echo ✅ || echo "❌ $1"; }
          status=success summary="flake check, format, mbp + tpad builds"
          for result in "$CHECK" "$FORMAT" "$DARWIN" "$LINUX"; do
            [ "$result" = success ] || { status=failure; summary="a check or build failed"; }
          done
          {
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Flake check | $(mark "$CHECK") |"
            echo "| Formatting | $(mark "$FORMAT") |"
            echo "| mbp (darwin) build | $(mark "$DARWIN") |"
            echo "| tpad (home-manager) build | $(mark "$LINUX") |"
          } >"$RUNNER_TEMP/details.md"
          "$GITHUB_WORKSPACE/.github/scripts/report-section.sh" workstations 10 Workstations "$status" "$summary" "$RUNNER_TEMP/details.md"
      - name: Upload CI report section
        uses: actions/upload-artifact@v4
        with:
          name: pr-report-workstations
          path: ${{ runner.temp }}/report/workstations.json
