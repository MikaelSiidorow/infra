apiVersion: v1
kind: Namespace
metadata:
  name: hack-static
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hack-static-nginx
  namespace: hack-static
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 256; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /dev/stdout;
      gzip on;
      gzip_vary on;
      gzip_min_length 1024;
      gzip_types text/css application/javascript application/json image/svg+xml;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server {
        listen 8080;
        server_name elisa.hack.miksu.app;
        root /srv/site/current;
        index index.html;
        server_tokens off;
        autoindex off;
        client_max_body_size 1k;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location / {
          limit_except GET { deny all; }
          try_files $uri $uri/ =404;
        }
        location ~ /\. { deny all; }
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hack-static
  namespace: hack-static
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hack-static
  template:
    metadata:
      annotations:
        presentation-config-version: "no-store-gzip-1"
      labels:
        app: hack-static
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: k8s-server
      containers:
        - name: nginx
          image: docker.io/nginx:stable-alpine@sha256:ef8676b33d681f272ba429b27658bdd7e640963279714c96bddf1dc76307f7b6
          command: ["nginx", "-g", "daemon off;"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          volumeMounts:
            - name: site
              mountPath: /srv/site
              readOnly: true
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 16Mi
        - name: site
          hostPath:
            path: /var/lib/hack-static
            type: Directory
        - name: config
          configMap:
            name: hack-static-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: hack-static
  namespace: hack-static
spec:
  selector:
    app: hack-static
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hack-static
  namespace: hack-static
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - elisa.hack.miksu.app
      secretName: hack-static-tls
  rules:
    - host: elisa.hack.miksu.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hack-static
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hack-static
  namespace: hack-static
spec:
  podSelector:
    matchLabels:
      app: hack-static
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
  egress: []
